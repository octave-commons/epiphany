name: apply-pr1-unit-fixes

on:
  pull_request:
    branches:
      - triage/2026-07-21-assurance-fixes-launcher

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/pr1-unit-diagnostics-20260725
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: "1.12.2.1565"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
      - name: Apply focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          section = Path('src/epiphany/domain/section_extraction.clj')
          text = section.read_text()
          assert text.count('{:keys [heading body _ordinal]}') == 1
          text = text.replace('{:keys [heading body _ordinal]}',
                              '{:keys [heading body ordinal]}')
          assert text.count('(or _ordinal 0)') == 1
          section.write_text(text.replace('(or _ordinal 0)', '(or ordinal 0)'))

          memory = Path('src/epiphany/infra/adapters/in_memory.clj')
          text = memory.read_text()
          old = '\n'.join([
              '  (fn [observation]',
              '    (validate-write! op observation)',
              '    (when-not (some #(= (:observation/id observation)',
              '                        (:observation/id %))',
              '                    @records)',
              '      (swap! records conj observation))',
              '    nil))'])
          new = '\n'.join([
              '  (fn [observation]',
              '    (validate-write! op observation)',
              '    (swap! records',
              '           (fn [current]',
              '             (if (some #(= (:observation/id observation)',
              '                            (:observation/id %))',
              '                       current)',
              '               current',
              '               (conj current observation))))',
              '    nil))'])
          assert text.count(old) == 1, text.count(old)
          memory.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Run verification
        shell: bash
        run: |
          set +e
          mkdir -p target/diagnostics
          {
            echo '=== unit-test ==='
            clojure -M:unit-test
            unit=$?
            echo '=== lint ==='
            clojure -M:lint
            lint=$?
            echo '=== boundary-check ==='
            clojure -M:boundary-check
            boundary=$?
            echo '=== interop-inventory ==='
            clojure -M:interop-inventory
            interop=$?
            echo "unit=$unit lint=$lint boundary=$boundary interop=$interop"
            test "$unit" -eq 0 -a "$lint" -eq 0 -a "$boundary" -eq 0 -a "$interop" -eq 0
          } > target/diagnostics/verification.log 2>&1
          status=$?
          tail -n 300 target/diagnostics/verification.log
          echo "$status" > target/diagnostics/exit-status
          exit "$status"
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1-unit-fix-verification
          path: target/diagnostics/
      - name: Commit verified fixes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-pr1-unit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve section ordinals and atomic replay dedupe'
          git push origin HEAD:automation/pr1-unit-diagnostics-20260725
