name: diagnose-pr1-unit

on:
  pull_request:
    branches:
      - triage/2026-07-21-assurance-fixes-launcher

permissions:
  contents: read

jobs:
  unit-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: "1.12.2.1565"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
      - name: Capture unit failure
        shell: bash
        run: |
          set +e
          mkdir -p target/diagnostics
          clojure -M:unit-test > target/diagnostics/unit.log 2>&1
          status=$?
          tail -n 300 target/diagnostics/unit.log
          echo "$status" > target/diagnostics/exit-status
          exit "$status"
      - name: Publish unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1-unit-diagnostics
          path: target/diagnostics/
