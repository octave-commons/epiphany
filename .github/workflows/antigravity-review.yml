# Generated by scripts/antigravity_rollout.clj; managed Antigravity review caller.
name: Antigravity evidence review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: antigravity-review-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.pull_request.draft == false }}
    uses: octave-commons/muse/.github/workflows/antigravity-code-review.yml@5bc9a8543ceb8afb04d3fd7e92ba0e1d9c2a03dd
    with:
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      pr_base_sha: ${{ github.event.pull_request.base.sha }}
      review_runtime_revision: 3bcf27bef296f9349fdf4997df256a617da5f120
      model: gemini-3.8-flash-high
