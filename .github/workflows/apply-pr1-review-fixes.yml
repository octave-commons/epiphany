name: apply-pr1-review-fixes

on:
  push:
    branches:
      - automation/pr1-review-fixes-20260725
  pull_request:
    branches:
      - triage/2026-07-21-assurance-fixes-launcher

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/pr1-review-fixes-20260725
          fetch-depth: 0
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pr1-review-fixes/*.part > /tmp/pr1-review-fixes.patch
          echo '80dbd086d11632cf923de26ee18af17b6dc8ca0583449f7a3c83c4dcd882de5b  /tmp/pr1-review-fixes.patch' | sha256sum --check --strict
          git apply --check /tmp/pr1-review-fixes.patch
          git apply /tmp/pr1-review-fixes.patch
          git diff --check
      - name: Commit reconstructed tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/pr1-review-fixes
          rm -f .github/workflows/apply-pr1-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: address unresolved PR review findings'
          git push origin HEAD:automation/pr1-review-fixes-20260725
