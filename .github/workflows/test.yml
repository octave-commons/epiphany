name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: "1.12.2.1565"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
      - name: Unit tests (no Docker, no network services)
        run: clojure -M:unit-test
      - name: Shipped CLI help smoke
        run: |
          output="$(bin/ep --help)"
          grep -F "epiphany — local-first" <<<"$output"
          grep -F "Usage: epiphany" <<<"$output"

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: "1.12.2.1565"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
      - name: Lint (clj-kondo, .clj-kondo/config.edn baseline)
        run: clojure -M:lint
      - name: Layer-boundary check (law/shape/domain/application/infra)
        run: clojure -M:boundary-check
      - name: Interop ratchet (reports/interop.edn baseline)
        run: clojure -M:interop-inventory

  assurance-evidence:
    runs-on: ubuntu-latest
    needs: [unit-test, static]
    # Record failures too — an artifact that only exists on green runs
    # can never record a failure (ENG-017J review finding).
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: "1.12.2.1565"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
      - name: Generate revision-bound assurance artifact
        run: clojure -M:assurance-evidence
      - name: Publish assurance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-evidence
          path: target/assurance/

  coverage:
    runs-on: ubuntu-latest
    # ENG-017L: coverage is REPORTED, not gated. This job is non-blocking
    # (continue-on-error) so a coverage regression is visible via the uploaded
    # artifact rather than failing the build, until the baseline is reviewed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: "1.12.2.1565"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
      - name: Coverage report (cloverage; excludes epiphany.integration.*)
        run: clojure -M:coverage
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/coverage/
